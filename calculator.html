<!DOCTYPE html>
<html>
  <head> 
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
   <link rel="stylesheet" href="calculator.css"/>
  </head>
  <body>
    <!-- The screen where the numbers will appear -->
    <p class="js-display display-screen"></p>

    <!-- Row 1 -->
    <p>
      <button class="key" onclick="updateCalculation('1')">1</button>
      <button class="key" onclick="updateCalculation('2')">2</button>
      <button class="key" onclick="updateCalculation('3')">3</button>
      <button class="operators" onclick="updateCalculation(' + ')">+</button>
    </p>

    <!-- Row 2 -->
    <p>
      <button class="key" onclick="updateCalculation('4')">4</button>
      <button class="key" onclick="updateCalculation('5')">5</button>
      <button class="key" onclick="updateCalculation('6')">6</button>
      <button class="operators" onclick="updateCalculation(' - ')">-</button>
    </p>

    <!-- Row 3 -->
    <p>
      <button class="key" onclick="updateCalculation('7')">7</button>
      <button class="key" onclick="updateCalculation('8')">8</button>
      <button class="key" onclick="updateCalculation('9')">9</button>
      <button class="operators" onclick="updateCalculation(' * ')">*</button>
    </p>

    <!-- Row 4 -->
    <p>
      <button class="key" onclick="updateCalculation('0')">0</button>
      <button class="key" onclick="updateCalculation('.')">.</button>
      <button class="key" onclick="calculateResult()">=</button>
      <button class="operators" onclick="updateCalculation(' / ')">/</button>
    </p>

    <!-- Row 5 -->
    <p>
      <button class="operators" onclick="clearCalculation()">Clear</button>
    </p>

    <script 
    src="calculator.js">
      
    </script>
  </body>
</html>
